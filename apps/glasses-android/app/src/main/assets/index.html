<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>dsh-glasses C0</title>
  <link rel="stylesheet" href="app.css"/>
</head>
<body>
  <header id="hudbar">
    <span id="mode" class="mode">NAV</span>
    <span id="conn" class="conn off">offline</span>
    <span id="session-state">unavailable</span>
  </header>

  <section id="identity-error" class="panel error hidden" role="alert">
    <h2>Session mismatch</h2>
    <p>Configured <code id="identity-expected"></code></p>
    <p>Endpoint <code id="identity-actual"></code></p>
    <p class="hint">Transport is stopped and endpoint content is hidden.</p>
  </section>

  <section id="provision" class="panel">
    <h2>Dev provisioning</h2>
    <input id="in-base" type="text" placeholder="endpoint base"/>
    <input id="in-session" type="text" placeholder="session id"/>
    <input id="in-token" type="password" placeholder="dev bearer token"/>
    <button id="save">Save</button>
    <p class="hint">App-private debug storage only.</p>
  </section>

  <main id="session" class="hidden">
    <section id="chat" aria-live="polite" aria-label="Chat history"></section>

    <section id="composer" class="composer hidden" aria-label="Authoritative draft">
      <div id="draft-meta"></div>
      <div id="draft-text" role="textbox" aria-readonly="true"></div>
      <div id="action-state"></div>
    </section>
  </main>

  <details id="diagnostics">
    <summary>Diagnostics</summary>
    <div class="diag-meta">
      session <span id="session-id"></span> · protocol <span id="proto"></span> ·
      generation <span id="gen"></span> · asOf <span id="asof"></span> ·
      write <span id="wsv"></span>
    </div>
    <ol id="events"></ol>
    <pre id="tracebox"></pre>
  </details>

  <script src="c0-core.js"></script>
  <script src="app.js"></script>
</body>
</html>
